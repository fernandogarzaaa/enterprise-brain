name: ci

on:
  push:
    branches: [main, release/v1.0.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check enterprise_brain tests
      - run: ruff format --check enterprise_brain tests
      - run: mypy enterprise_brain tests

  test:
    name: tests (python ${{ matrix.python }}, sqlite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: pytest -q --cov=enterprise_brain --cov-report=term-missing:skip-covered

  test-postgres:
    name: tests (postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: eb
          POSTGRES_PASSWORD: eb
          POSTGRES_DB: eb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eb -d eb_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://eb:eb@localhost:5432/eb_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: pytest -q

  package:
    name: build + docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: install wheel in a clean venv and run the CLI
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && DATABASE_URL=sqlite:////tmp/smoke.db DATA_DIR=/tmp/smoke /tmp/wheel-venv/bin/enterprise-brain seed-demo
          cd /tmp && DATABASE_URL=sqlite:////tmp/smoke.db DATA_DIR=/tmp/smoke /tmp/wheel-venv/bin/enterprise-brain ask "Which invoices are overdue?"
      - run: docker build -t enterprise-brain:ci .
      - name: run the container and probe readiness
        run: |
          docker run -d --name eb -p 8002:8002 \
            -e ENVIRONMENT=production -e SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" \
            -e ADMIN_EMAIL=admin@example.com -e ADMIN_PASSWORD=ci-admin-password-123 -e DEMO_DATA=true \
            enterprise-brain:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8002/api/health/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8002/api/health/ready
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8002/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"ci-admin-password-123"}' | python -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -fsS -X POST http://127.0.0.1:8002/api/ask -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"question":"What is the status of the Acme Corp contract?"}' | tee /tmp/answer.json
          grep -q '\[1\]' /tmp/answer.json
          docker exec eb enterprise-brain healthcheck
      - if: failure()
        run: docker logs eb || true
