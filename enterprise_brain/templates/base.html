<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-stone-100 text-stone-900">
<div class="flex min-h-screen">
  <aside class="w-60 shrink-0 bg-white border-r border-stone-200 flex flex-col">
    <div class="px-5 py-4 border-b border-stone-200">
      <div class="text-lg font-bold tracking-tight">
        <span class="text-orange-600">&#9632;</span> {{ app_name }}
      </div>
      <div class="text-xs text-stone-500">v{{ version }}</div>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1 text-sm">
      {% for href, label in nav %}
      <a href="{{ href }}" class="block px-3 py-2 rounded-lg {{ 'bg-orange-100 text-orange-800 font-medium' if href == active else 'text-stone-600 hover:bg-stone-100' }}">{{ label }}</a>
      {% endfor %}
    </nav>
    <div class="px-5 py-4 border-t border-stone-200 text-xs text-stone-500">
      {% if user %}{{ user.email }} &middot; {{ user.role }}<br><a href="/logout" class="text-orange-600 hover:underline">Sign out</a>{% endif %}
    </div>
  </aside>
  <main class="flex-1 min-w-0">
    <div class="max-w-7xl mx-auto px-6 py-6">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>
<script>
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(url, opts={}){
  const r = await fetch(url, Object.assign({credentials:'same-origin'}, opts));
  let data = {};
  try { data = await r.json(); } catch(e) {}
  if(r.status === 401){ location.href = '/login'; }
  return {ok: r.ok, status: r.status, data};
}
function jsonBody(obj, method='POST'){ return {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj)}; }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
