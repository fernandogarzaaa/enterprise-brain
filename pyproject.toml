[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-brain"
version = "1.0.0"
description = "Unified AI intelligence layer: ask questions in natural language across your company's documents, contracts, and data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fernando Garza", email = "fernandogarzaaa@gmail.com" }]
requires-python = ">=3.11"
keywords = ["rag", "enterprise-search", "llm", "fastapi", "knowledge-base"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "pyjwt>=2.9,<3",
  "bcrypt>=4.1,<6",
  "jinja2>=3.1,<4",
  "numpy>=1.26,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.18",
  "httpx>=0.27,<1",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9,<3"]
st = ["sentence-transformers>=3"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
]

[project.scripts]
enterprise-brain = "enterprise_brain.cli:main"

[project.urls]
Homepage = "https://github.com/fernandogarzaaa/enterprise-brain"
Issues = "https://github.com/fernandogarzaaa/enterprise-brain/issues"
Changelog = "https://github.com/fernandogarzaaa/enterprise-brain/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["enterprise_brain*"]

[tool.setuptools.package-data]
enterprise_brain = [
  "templates/*.html",
  "templates/auth/*.html",
  "static/*.css",
  "static/vendor/*.js",
  "demo_data/*.json",
  "demo_data/documents/*.md",
  "demo_data/connectors/*.txt",
  "migrations/script.py.mako",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["enterprise_brain"]
omit = ["enterprise_brain/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT"]
ignore = [
  "S101",   # assert for type narrowing
  "S104",   # binding 0.0.0.0 is intended inside containers
  "B008",   # FastAPI Depends() in defaults
  "S608",   # SQL strings are built from constants only (migrations / pgvector)
  "RUF012",
  "UP017",  # keep datetime.timezone.utc for readability
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "PT011", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = ["docx", "docx.*", "apscheduler.*", "sentence_transformers"]
ignore_missing_imports = true

[tool.testteeth]
paths = [
  "enterprise_brain/ask.py",
  "enterprise_brain/ingest.py",
  "enterprise_brain/security.py",
  "enterprise_brain/llm.py",
  "enterprise_brain/vectorstore.py",
  "enterprise_brain/config.py",
  "enterprise_brain/users.py",
  "enterprise_brain/sources.py",
]
