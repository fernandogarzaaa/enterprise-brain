# Production-style stack: Enterprise Brain + PostgreSQL with pgvector.
#   cp .env.example .env   # set SECRET_KEY, ADMIN_EMAIL, ADMIN_PASSWORD, POSTGRES_PASSWORD (and an LLM if wanted)
#   docker compose up -d --build
services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eb-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_brain}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eb} -d ${POSTGRES_DB:-enterprise_brain}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: enterprise-brain:1.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-eb}:${POSTGRES_PASSWORD:-eb-local-only}@db:5432/${POSTGRES_DB:-enterprise_brain}
      DATA_DIR: /data
      PORT: ${PORT:-8002}
    ports:
      - "${PORT:-8002}:${PORT:-8002}"
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
