# Developer config for `alembic revision --autogenerate`. At runtime migrations are
# applied by `enterprise-brain migrate` (or on startup), which reads DATABASE_URL.
[alembic]
script_location = enterprise_brain/migrations
sqlalchemy.url = sqlite:///./data/enterprise_brain.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5s [%(name)s] %(message)s
